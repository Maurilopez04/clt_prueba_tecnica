services:
  api:
    image: clt-api:1.0.0
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      HttpsRedirection__Enabled: "false"
      ConnectionStrings__DefaultConnection: "Data Source=/app/data/clt.db;Foreign Keys=True"
    volumes:
      - clt-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  clt-data:
